name: Update studios

on:
    schedule:
        - cron: "*/30 * * * *"
    workflow_dispatch:

jobs:
    collect:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install deps
              run: pip install requests icalendar recurring-ical-events
            - name: Run collect
              env:
                  GCAL_API_KEY: ${{ secrets.GCAL_API_KEY }}
              run: python collect.py
            - name: Commit data.js
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data.js
                  git diff --cached --quiet || git commit -m "update data"
                  git push
